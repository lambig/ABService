# Docker Compose for Development Environment
# This file is specifically for development with additional debugging tools

version: '3.8'

services:
  # PostgreSQL with additional development tools
  postgres:
    image: postgres:15.20-alpine3.24@sha256:23799e521dee9265a8b388ecf3bc0f1eaa34b95be67f5a76af4f8f6adb44c720
    container_name: abservice-postgres-dev
    restart: unless-stopped
    environment:
      POSTGRES_DB: abservice
      POSTGRES_USER: abservice
      POSTGRES_PASSWORD: abservice
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --locale=C"
      # Development-specific settings
      POSTGRES_LOG_STATEMENT: "all"
      POSTGRES_LOG_MIN_DURATION_STATEMENT: "0"
      POSTGRES_LOG_LINE_PREFIX: "%t [%p]: [%l-1] user=%u,db=%d,app=%a,client=%h "
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
      - ./docker/postgres/conf/postgresql.conf:/etc/postgresql/postgresql.conf:ro
    networks:
      - abservice-dev-network
    command: postgres -c config_file=/etc/postgresql/postgresql.conf
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U abservice -d abservice"]
      interval: 5s
      timeout: 5s
      retries: 5

  mailhog:
    image: mailhog/mailhog:latest
    container_name: abservice-mailhog-dev
    restart: unless-stopped
    ports:
      - "127.0.0.1:1025:1025"  # SMTP
      - "127.0.0.1:8025:8025"  # Web UI
    networks:
      - abservice-dev-network

  # MinIO for object storage testing
  # 基本の compose と同じ公式ソースの固定コミットからビルドする。
  minio:
    build:
      context: ./docker/minio
      target: minio
    container_name: abservice-minio-dev
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin123
      MINIO_BROWSER_REDIRECT_URL: "http://localhost:9001"
    ports:
      - "127.0.0.1:9000:9000"  # API
      - "127.0.0.1:9001:9001"  # Console
    volumes:
      - minio_dev_data:/data
    networks:
      - abservice-dev-network
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  # pgAdmin for database management
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: abservice-pgadmin-dev
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@abservice.com
      PGADMIN_DEFAULT_PASSWORD: admin123
      PGADMIN_CONFIG_SERVER_MODE: 'False'
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: 'False'
    ports:
      - "127.0.0.1:5050:80"
    volumes:
      - pgadmin_dev_data:/var/lib/pgadmin
    networks:
      - abservice-dev-network
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_dev_data:
    driver: local
  minio_dev_data:
    driver: local
  pgadmin_dev_data:
    driver: local

networks:
  abservice-dev-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.21.0.0/16
