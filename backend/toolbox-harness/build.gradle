plugins {
    id 'java-library'
    id 'maven-publish'
}

group = 'io.github.lambig'
version = '0.1.0-SNAPSHOT'

repositories { mavenCentral() }

dependencies {
    api 'com.tngtech.archunit:archunit:1.5.0'
    testImplementation 'junit:junit:4.13.2'
}

java {
    sourceCompatibility = JavaVersion.VERSION_1_8
    targetCompatibility = JavaVersion.VERSION_1_8
    withSourcesJar()
    withJavadocJar()
}
tasks.withType(JavaCompile).configureEach {
    options.release = 8
    options.encoding = 'UTF-8'
}
tasks.withType(Javadoc).configureEach { options.encoding = 'UTF-8' }

publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java
            pom {
                name = 'toolbox-harness'
                description = 'Configurable method access rules for architecture tests.'
            }
        }
    }
    repositories {
        maven {
            name = 'Candidate'
            url = layout.buildDirectory.dir('repository')
        }
    }
}
