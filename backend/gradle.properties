# Gradle properties

quarkusPluginId=io.quarkus
quarkusPluginVersion=3.38.3
quarkusPlatformGroupId=io.quarkus.platform
quarkusPlatformArtifactId=quarkus-bom
quarkusPlatformVersion=3.38.3

# Build Configuration
org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m -XX:+HeapDumpOnOutOfMemoryError
org.gradle.parallel=false
org.gradle.caching=true
org.gradle.configureondemand=true

# Java 25 Configuration
# JDK は build.gradle の toolchain(languageVersion=25) と JAVA_HOME で解決する。
# org.gradle.java.home のマシン固有パス固定はしない（環境差でビルド不能になるため）。
# ローカルで JAVA_HOME を明示したい場合は .claude/settings.local.json の env などで指定する。

# Quarkus Configuration
# 単一実行可能jar（uber-jar）を出力する。Dockerfile.jvm は build/*-runner.jar をコピーする。
quarkus.package.jar.type=uber-jar
quarkus.native.container-build=true
quarkus.native.builder-image=quay.io/quarkus/ubi9-quarkus-mandrel-builder-image:jdk-25

# Test Configuration
quarkus.test.profile=test
quarkus.test.continuous-testing=disabled
