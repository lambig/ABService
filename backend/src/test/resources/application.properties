# Test Configuration

# 統合テストは専用のデータベースへ書く（#252）。開発用（abservice）を clean すると、開発中に作った
# データが消えるうえ、残ったテストデータが E2E の母集団にも混ざる。
# 上書きするのは DB 名の単一の出所（abservice.db.name）だけにする。jdbc と reactive の両方がこれを
# 参照するため、Flyway が clean するデータベースとアプリがクエリするデータベースは食い違わない。
# ホスト・ポート・認証情報は main 側の定義をそのまま使う。
%test.abservice.db.name=abservice_test

# Flyway: テスト時にデータベースをクリーンにする
%test.quarkus.flyway.clean-at-start=true
