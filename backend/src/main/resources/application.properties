# ABService Backend Configuration

quarkus.application.name=abservice-backend
quarkus.application.version=1.0.0-SNAPSHOT

# HTTP Configuration
quarkus.http.port=8080
quarkus.http.host=0.0.0.0

# CORS Configuration
# 本番は単一ドメイン・パスベースルーティング（CloudFront）でフロントエンドとAPIが同一オリジンになるためCORSは不要。
# 開発・テストはフロントエンドの開発サーバが別ポートになるため有効にする。
# 別オリジン構成へ変える場合は CORS_ENABLED と CORS_ORIGINS を対で設定する（origins未設定のまま有効化すると
# 全オリジンが許可されるため、既定値はローカル開発サーバのみに絞っている）。
# Cookieを使わずAuthorizationヘッダのみで認証するため資格情報の許可は明示的に切る
# （オリジンを列挙するとQuarkusの既定がtrueになるため、既定に任せず明示する）。
quarkus.http.cors.enabled=${CORS_ENABLED:false}
quarkus.http.cors.origins=${CORS_ORIGINS:http://localhost:5173,http://localhost:4321}
quarkus.http.cors.methods=GET,POST,PUT,DELETE,OPTIONS
quarkus.http.cors.headers=Content-Type,Authorization
quarkus.http.cors.access-control-allow-credentials=false
%dev.quarkus.http.cors.enabled=true
%test.quarkus.http.cors.enabled=true

# OpenAPI / Swagger UI
# API定義はJAX-RSの型情報から生成する（エンドポイントごとの注釈は置かない。契約の正は実装）。
# 管理操作の認証要件は @RolesAllowed から自動付与する。
# Swagger UI は開発時のみ（Quarkus既定）。CloudFrontは /api/* だけをbackendへ流すため、
# /q/* は本番で外部から到達しない。
quarkus.smallrye-openapi.security-scheme-name=adminApiKey
quarkus.smallrye-openapi.auto-add-security-requirement=true

# Authentication Configuration
# 管理操作（Command系・管理向けQuery）は Authorization: Bearer <APIキー> を要求する。
# 開発・テストのみ既定値を持ち、prod では ADMIN_API_KEY 未設定時に起動を失敗させる。
abservice.auth.admin-api-key=${ADMIN_API_KEY:dev-admin-api-key}
%prod.abservice.auth.admin-api-key=${ADMIN_API_KEY}
%test.abservice.auth.admin-api-key=test-admin-api-key

# Asset Storage Configuration
# アセット（画像）はクライアントから署名付きURLで直接S3互換ストレージへ送られ、backendは経由しない。
# public-base-path は CloudFront のビヘイビアと一致させる（先頭スラッシュを除いた値が保管キーの接頭辞になる）。
abservice.assets.bucket=${ASSETS_BUCKET:abservice-assets}
abservice.assets.public-base-path=/assets
# 受け入れ前の実体の置き場。配信パス（public-base-path）とは別の接頭辞にすることで、検査前・破棄対象の実体が
# CDN から配信されない。確定はこの接頭辞から配信対象への保管先内コピーで行い、配信キーへ書き込める署名付きURLは
# 発行しない（確定後に配信実体が差し替わらない）。
abservice.assets.pending-prefix=pending
abservice.assets.max-bytes=52428800
abservice.assets.presign-expiry=PT10M
%prod.abservice.assets.bucket=${ASSETS_BUCKET}
# 統合テストは上限超過の拒否を確認するため小さい上限にする。
%test.abservice.assets.max-bytes=1024

# S3 Client Configuration
# 開発・テストは docker compose の MinIO（パススタイル・静的キー）、本番は実S3（バーチャルホスト形式・
# EC2インスタンスプロファイル）。空値は「未設定」として扱われる。
quarkus.s3.aws.region=${AWS_REGION:ap-northeast-1}
quarkus.s3.path-style-access=true
quarkus.s3.endpoint-override=${S3_ENDPOINT_OVERRIDE:http://localhost:9000}
quarkus.s3.aws.credentials.type=static
quarkus.s3.aws.credentials.static-provider.access-key-id=${S3_ACCESS_KEY:minioadmin}
quarkus.s3.aws.credentials.static-provider.secret-access-key=${S3_SECRET_KEY:minioadmin123}
%prod.quarkus.s3.path-style-access=false
%prod.quarkus.s3.endpoint-override=
%prod.quarkus.s3.aws.credentials.type=default
%prod.quarkus.s3.aws.credentials.static-provider.access-key-id=
%prod.quarkus.s3.aws.credentials.static-provider.secret-access-key=

# Database Configuration
# 既定値は docker compose のローカルPostgreSQL向け。prod では接続先・認証情報を環境変数必須にし、
# 設定漏れがあれば弱い既定値へフォールバックせず起動を失敗させる
# （本番の値は Parameter Store から deploy.sh が注入する。infra/README.md）。
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=${DB_USERNAME:abservice}
quarkus.datasource.password=${DB_PASSWORD:abservice}
quarkus.datasource.jdbc.url=${DB_URL:jdbc:postgresql://localhost:5432/abservice}
quarkus.datasource.reactive.url=${DB_REACTIVE_URL:postgresql://localhost:5432/abservice}
%prod.quarkus.datasource.username=${DB_USERNAME}
%prod.quarkus.datasource.password=${DB_PASSWORD}
%prod.quarkus.datasource.jdbc.url=${DB_URL}
%prod.quarkus.datasource.reactive.url=${DB_REACTIVE_URL}

# Hibernate Configuration
quarkus.hibernate-orm.schema-management.strategy=none
quarkus.hibernate-orm.sql-load-script=no-file
quarkus.hibernate-orm.log.sql=${QUARKUS_HIBERNATE_ORM_LOG_SQL:false}

# Flyway Configuration
# baseline-on-migrate は無効にする。有効だと、履歴を持たない非空のDBへ接続したときに既存schemaを
# 「baseline済み」として受け入れてしまい、本来適用すべき初期マイグレーションの欠落を起動失敗として
# 検出できない。schemaの正はマイグレーションであり、齟齬は起動時に落として気付ける方がよい。
# 履歴を持たない既存DBを取り込む必要が生じた場合は、一回限りの明示的な操作として baseline する
# （手順は infra/README.md）。
quarkus.flyway.migrate-at-start=true
quarkus.flyway.baseline-on-migrate=false
quarkus.flyway.validate-on-migrate=true
quarkus.flyway.clean-at-start=false
quarkus.flyway.locations=classpath:db/migration

# Health / Metrics
# /q/health/{live,ready} と /q/metrics（Prometheus形式）は拡張の既定パス・既定設定のまま使う。
# readiness のDB接続確認は datasource 拡張が自動登録する（内容は統合テストで固定）。
# CloudFrontは /api/* だけをbackendへ流すため、いずれも本番で外部から到達しない。

# Logging Configuration
# アプリケーションのカテゴリは開発・テストでは DEBUG、prod では INFO
# （本番で出力量とレイテンシを増やさないため）。
# 出力形式は prod のみ JSON（1レコード1行）。収集先の設定は #168。
quarkus.log.level=INFO
quarkus.log.category."com.abservice".level=DEBUG
quarkus.log.console.json.enabled=false
%prod.quarkus.log.category."com.abservice".level=INFO
%prod.quarkus.log.console.json.enabled=true
