<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!--
    サイトの印（#341）。これは既定であって、正式な意匠ではない。正式版は運用側（#375）で決めてここへ
    差し替える。リンクプレビューの既定画像もこの SVG から焼くため（scripts/render-og-image.mjs）、
    差し替えはこの1ファイルで済む。

    文字を使わない。サイト名はデータ側にあり（#230）、リポジトリからは読み取れない。

    色は styles/global.css のライトの組（background / foreground / primary）と同じ値。画像は CSS の
    トークンを読めないため、ここだけは実値を持つ。地を塗るのは、タブの帯が暗いときに罫が消えないため。

    地は角丸にしない。サイトの角丸は 0.125rem でほぼ直角であり、ここだけ丸めると、リンクプレビューの
    広い面へ収めたときに角丸の板が浮いて見える。

    XML-COMMENT: この説明を先頭へ出さない。ファイルがコメントで始まると焼く側が形式を判定できない。
    トークン名を二重ハイフン付きで書かないのも同じ理由で、XML のコメントはそれを許さない。
  -->
  <rect width="32" height="32" fill="#f8f4ef" />
  <path d="M5 8h22M5 16h22M5 24h22" stroke="#281f1b" stroke-width="2" />
  <circle cx="16" cy="16" r="5" fill="#325f43" />
</svg>
