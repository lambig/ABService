<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Listening Room — AB</title>
  </head>
  <body>
    <header>
      <a class="brand" href="/" aria-label="Listening Room ホーム"
        >AB<span>LISTENING ROOM</span></a
      ><span class="edition">PLAYER STUDY / 01</span>
    </header>
    <main>
      <section class="intro">
        <p class="eyebrow">作品を選んで、音を聴く</p>
        <h1>A moment to listen.</h1>
        <p>アルバムから曲を選び、再生してください。</p>
      </section>
      <div class="workspace">
        <nav id="library" aria-label="アルバムと曲目"></nav>
        <section class="player" aria-label="プレイヤー">
          <div class="cover" aria-hidden="true">
            <span>AB / SOUND STUDIES</span>
            <div class="rings"></div>
            <strong>01</strong>
          </div>
          <div class="now">
            <p id="album-title" class="eyebrow">YOUR SELECTION</p>
            <h2 id="track-title">曲を選んでください</h2>
            <p id="play-status" role="status" aria-live="polite">待機中</p>
          </div>
          <label for="seek">再生位置</label
          ><input
            id="seek"
            type="range"
            min="0"
            max="0"
            step="0.1"
            value="0"
            disabled
          />
          <div class="time">
            <output id="position">0:00</output
            ><output id="duration">0:00</output>
          </div>
          <div class="controls">
            <button id="play" class="primary" disabled>再生</button
            ><button id="pause" disabled>一時停止</button
            ><button id="stop" disabled>停止</button>
          </div>
          <p id="error" role="alert"></p>
          <button id="retry" hidden>音源を読み直す</button>
        </section>
      </div>
    </main>
    <footer>
      <span>AB / LISTENING ROOM</span
      ><span>短い合成音を使った再生操作の検証用サンプルです。</span>
    </footer>
    <script type="module" src="/src/demo.ts"></script>
  </body>
</html>
