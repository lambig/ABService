[package]
name = "abservice-audio-kernel"
version = "0.0.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
rustfft = { version = "=6.4.1", default-features = false, features = ["wasm_simd"] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"
