name: Deploy

# mainへの統合は配布しない。main上の制御workflowから、検証済みrelease候補を明示的に配布する。
on:
  workflow_call:
    inputs:
      source_repository:
        description: "Public source repository; the caller owns deployment settings and logs"
        type: string
        required: true
      controller_sha:
        description: "Reviewed full source SHA, pinned alongside the reusable workflow reference"
        type: string
        required: true
      action:
        type: string
        required: true
      commit_sha:
        type: string
        required: true
      release_branch:
        type: string
      release_tag:
        type: string
      ci_run_id:
        type: string
  workflow_dispatch:
    inputs:
      action:
        description: "検証済み候補の配布、または保存済みbackendイメージへの切り戻し"
        required: true
        type: choice
        options: [rollback, release]
        default: rollback
      release_branch:
        description: "release時: 候補ブランチ（release/1.10等）"
        type: string
      release_tag:
        description: "release時: 候補SHAに固定したタグ（v1.10.0等）"
        type: string
      ci_run_id:
        description: "release時: 候補ブランチ上のpushまたは手動実行で全件成功したCI run ID"
        type: string
      commit_sha:
        description: "対象commitのfull SHA。releaseは検証済み候補、rollbackは保存済みイメージのみ"
        required: true
        type: string

permissions:
  id-token: write
  contents: read
  actions: read

# preflightから両画面の配布完了まで、手動frontend操作も同じgroupで待たせる。
# queueはgroupで待ち始めた順（手動起動の待機順）であり、commit順ではない。
concurrency:
  group: deploy-production
  cancel-in-progress: false
  queue: max

jobs:
  preflight:
    name: Check frontend release before backend deployment
    if: >-
      github.ref == 'refs/heads/main' &&
      github.event_name == 'workflow_dispatch' && inputs.action == 'release' &&
      vars.AWS_DEPLOY_ROLE_ARN != '' && vars.AWS_FRONTEND_DEPLOY_ROLE_ARN != ''
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      attempt: ${{ steps.release-state.outputs.attempt }}
      deploy: ${{ steps.release-state.outputs.deploy }}
    env:
      RELEASE_SHA: ${{ inputs.commit_sha }}
      RELEASE_ID: ${{ github.run_id }}-${{ github.run_attempt }}
      FRONTEND_PUBLIC_BUCKET: ${{ vars.FRONTEND_PUBLIC_BUCKET }}
      FRONTEND_ADMIN_BUCKET: ${{ vars.FRONTEND_ADMIN_BUCKET }}
      FRONTEND_RELEASE_BUCKET: ${{ vars.FRONTEND_RELEASE_BUCKET }}
      CLOUDFRONT_DISTRIBUTION_ID: ${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}
    steps:
      - name: Validate source and controller inputs before checkout
        env:
          SOURCE_REPOSITORY: ${{ inputs.source_repository }}
          CONTROLLER_SHA: ${{ inputs.controller_sha }}
        run: |
          if [ -n "$SOURCE_REPOSITORY$CONTROLLER_SHA" ]; then
            [[ "$SOURCE_REPOSITORY" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]]
            [[ "$CONTROLLER_SHA" =~ ^[a-f0-9]{40}$ ]]
          fi
      - uses: actions/checkout@v4
        with:
          repository: ${{ inputs.source_repository || github.repository }}
          ref: ${{ inputs.controller_sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Verify candidate, tag and complete CI before AWS access
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SOURCE_REPOSITORY: ${{ inputs.source_repository || github.repository }}
          COMMIT_SHA: ${{ inputs.commit_sha }}
          RELEASE_BRANCH: ${{ inputs.release_branch }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          CI_RUN_ID: ${{ inputs.ci_run_id }}
        run: node infra/release/candidate.mjs
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_FRONTEND_DEPLOY_ROLE_ARN }}
          aws-region: ap-northeast-1
      - name: Reject incomplete or unreadable frontend release state
        id: release-state
        run: |
          node infra/release/frontend.mjs preflight
          node infra/release/frontend.mjs record-candidate
          echo "attempt=$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"

  deploy:
    needs: preflight
    name: Build, push, and deploy backend
    # 未設定は既存EC2/arm64。cohost/amd64は明示的なopt-inとし、未知の値はAWS認証前に拒否する。
    runs-on: ${{ vars.BACKEND_DEPLOY_TARGET == 'cohost-amd64' && 'ubuntu-24.04' || 'ubuntu-24.04-arm' }}
    timeout-minutes: 40
    # terraform apply（#129のドメイン準備待ち）でリポジトリ変数が設定されるまでは何もしない。
    # rollbackだけは既存の復旧経路としてpreflightを通らない。
    if: >-
      !cancelled() && github.ref == 'refs/heads/main' &&
      github.event_name == 'workflow_dispatch' && vars.AWS_DEPLOY_ROLE_ARN != '' && (
        (inputs.action == 'rollback' && needs.preflight.result == 'skipped') || (
          inputs.action == 'release' && needs.preflight.result == 'success' &&
          needs.preflight.outputs.deploy == 'true' &&
          needs.preflight.outputs.attempt == github.run_attempt))

    outputs:
      commit_sha: ${{ steps.resolve.outputs.commit_sha }}
      attempt: ${{ steps.resolve.outputs.attempt }}

    steps:
      - name: Validate source and controller inputs before checkout
        env:
          SOURCE_REPOSITORY: ${{ inputs.source_repository }}
          CONTROLLER_SHA: ${{ inputs.controller_sha }}
        run: |
          if [ -n "$SOURCE_REPOSITORY$CONTROLLER_SHA" ]; then
            [[ "$SOURCE_REPOSITORY" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]]
            [[ "$CONTROLLER_SHA" =~ ^[a-f0-9]{40}$ ]]
          fi
      # CIが検査したSHAをそのまま対象にする（デプロイ時点のmain先端ではない）。手動起動では指定された
      # commit を取る。動かすイメージも、それを配る手順（deploy.sh / compose）も、同じ commit から決まる。
      - name: Checkout
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.source_repository || github.repository }}
          ref: ${{ inputs.commit_sha }}
          persist-credentials: false

      - name: Validate deployment target before AWS access
        env:
          TARGET: ${{ vars.BACKEND_DEPLOY_TARGET }}
          NODE: ${{ vars.COHOST_MANAGED_NODE_ID }}
        run: |
          case "$TARGET" in
            ''|ec2-arm64) ;;
            cohost-amd64)
              [[ "$NODE" =~ ^mi-[a-f0-9]{17}$ ]]
              git cat-file -e HEAD:infra/host/cohost/deploy.py
              git cat-file -e HEAD:infra/host/cohost/init-db.sh
              ;;
            *) echo "Unsupported backend deployment target" >&2; exit 1 ;;
          esac

      # Transport is controller code; the two host scripts are read from the candidate's Git objects.
      - name: Checkout cohost delivery controller
        if: vars.BACKEND_DEPLOY_TARGET == 'cohost-amd64'
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.source_repository || github.repository }}
          ref: ${{ inputs.controller_sha || github.sha }}
          path: .release-controller
          persist-credentials: false

      - name: Resolve image tag
        id: resolve
        env:
          ACTION: ${{ inputs.action }}
          COMMIT_SHA: ${{ inputs.commit_sha }}
          CI_RUN_ID: ${{ inputs.ci_run_id }}
          CI_HEAD_SHA: ${{ inputs.commit_sha }}
        run: |
          # commit_sha が空だと checkout が既定のブランチへ倒れ、配るファイルと対象イメージが
          # 別の commit のものになる。ビルドも配布もする前に止める
          if ! [[ "$COMMIT_SHA" =~ ^[a-f0-9]{40}$ ]] || [ "$(git rev-parse HEAD)" != "$COMMIT_SHA" ]; then
            echo "commit_sha must be the checked-out full SHA." >&2
            echo "Use action=release with successful release-branch CI to ship a new commit." >&2
            exit 1
          fi

          # タグは checkout した commit から決まる。手動起動でも、配るファイルと同じ commit の
          # イメージだけが対象になる（そのタグが ECR に在ることは digest を解くステップが確かめる）。
          # 接頭辞は infra/ecr.tf の保持規則と揃える（scripts/check-deploy-image-tag.sh が突き合わせる）
          echo "tag=sha-$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "commit_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "attempt=$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"

          if [ "$ACTION" = "rollback" ]; then
            echo "Redeploying the image built from $(git rev-parse HEAD) without rebuilding"
          else
            echo "Deploying commit $CI_HEAD_SHA verified by CI run $CI_RUN_ID"
          fi

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ap-northeast-1

      - name: Login to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      # 同じ commit のイメージを二度は作らない。ベースイメージやパッケージの取得を含むビルドは、同じ
      # commit でも同じ実体にならないため、作り直すとタグが別の digest へ移り、以前その commit で配った
      # 実体は untagged になって消える。ロールバックが戻すのは「その commit に最初に配った実体」であり、
      # それを保つには在るものを使うほかない（DECISIONS 16）。タグが在れば通常経路でもビルドと push を飛ばす。
      # action=rollbackでタグが無ければ、保持の期限を過ぎたか一度も配っていない commit なので止める
      - name: Check whether the image for this commit already exists
        id: existing
        env:
          ACTION: ${{ inputs.action }}
          REPOSITORY: ${{ vars.ECR_REPOSITORY }}
          TAG: ${{ steps.resolve.outputs.tag }}
        run: |
          ERROR_FILE="$(mktemp)"
          trap 'rm -f "$ERROR_FILE"' EXIT
          if aws ecr describe-images --repository-name "$REPOSITORY" --image-ids imageTag="$TAG" >/dev/null 2>"$ERROR_FILE"; then
            echo "Reusing the image already built for $TAG; it is not rebuilt or pushed again."
            echo "exists=true" >> "$GITHUB_OUTPUT"
          elif ! grep -q '(ImageNotFoundException)' "$ERROR_FILE"; then
            echo "Image lookup failed; absence was not established." >&2
            exit 1
          elif [ "$ACTION" = "rollback" ]; then
            echo "Rollback requires a retained image; it never rebuilds a missing tag." >&2
            exit 1
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      # 通常経路: CIが成功したcommitのイメージをビルドしてpushする（その commit のイメージが無いときだけ）。
      # jar はランナー上の Gradle で組み、Dockerfile はそれを包むだけ（CI の container-check と同じ手順。#431）
      - name: Set up JDK 25 (Corretto)
        if: steps.existing.outputs.exists == 'false'
        uses: actions/setup-java@v4
        with:
          distribution: corretto
          java-version: '25'

      - name: Set up Gradle
        if: steps.existing.outputs.exists == 'false'
        uses: gradle/actions/setup-gradle@v4

      - name: Build backend
        if: steps.existing.outputs.exists == 'false'
        run: |
          chmod +x backend/gradlew
          backend/gradlew -p backend --no-daemon --console=plain quarkusBuild

      - name: Build image
        if: steps.existing.outputs.exists == 'false'
        env:
          REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          REPOSITORY: ${{ vars.ECR_REPOSITORY }}
          TAG: ${{ steps.resolve.outputs.tag }}
        run: |
          docker build -f backend/src/main/docker/Dockerfile.jvm \
            -t "$REGISTRY/$REPOSITORY:$TAG" \
            backend

      # ECR へ入れる前に、実機が動かせる架構であることを確かめる。ランナーの種類が変わっても
      # ここで気付ける（動かない manifest を push してからでは、失敗するのはデプロイの最中になる）
      - name: Verify the image architecture matches the host
        if: steps.existing.outputs.exists == 'false'
        env:
          REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          REPOSITORY: ${{ vars.ECR_REPOSITORY }}
          TAG: ${{ steps.resolve.outputs.tag }}
          EXPECTED_ARCH: ${{ vars.BACKEND_DEPLOY_TARGET == 'cohost-amd64' && 'amd64' || 'arm64' }}
        run: |
          ARCH="$(docker image inspect "$REGISTRY/$REPOSITORY:$TAG" --format '{{.Architecture}}')"
          if [ "$ARCH" != "$EXPECTED_ARCH" ]; then
            echo "The image architecture does not match the selected deployment target." >&2
            exit 1
          fi
          echo "image architecture: $ARCH"

      - name: Push image
        if: steps.existing.outputs.exists == 'false'
        env:
          REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          REPOSITORY: ${{ vars.ECR_REPOSITORY }}
          TAG: ${{ steps.resolve.outputs.tag }}
        run: docker push "$REGISTRY/$REPOSITORY:$TAG"

      # 配るのはタグではなく digest。タグは IMMUTABLE で動かないが、配った実体をログと Summary に
      # 一意に残すのは digest であり、証跡（運用側の台帳）が記録する「稼働 image digest」の出所になる
      - name: Resolve the image digest
        id: digest
        env:
          REPOSITORY: ${{ vars.ECR_REPOSITORY }}
          TAG: ${{ steps.resolve.outputs.tag }}
        run: |
          DIGEST="$(aws ecr describe-images --repository-name "$REPOSITORY" --image-ids imageTag="$TAG" \
            --query 'imageDetails[0].imageDigest' --output text)"
          case "$DIGEST" in
          sha256:*) ;;
          *)
            echo "Could not resolve a digest for $REPOSITORY:$TAG (got '$DIGEST')." >&2
            exit 1
            ;;
          esac
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"
          echo "image tag: $TAG"
          echo "image digest: $DIGEST"
          {
            echo "## Backend image"
            echo "- tag: \`$TAG\`"
            echo "- digest: \`$DIGEST\`"
          } >> "$GITHUB_STEP_SUMMARY"

      # 保存済みtagも新規buildも、SSMへ渡す同じdigestをECRから取得して検査する。
      # tagの存在はarchitectureの証明ではない。rollbackでも省略せず、不一致は再buildせず拒否する。
      - name: Verify the retained image platform before deployment
        timeout-minutes: 5
        env:
          REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          REPOSITORY: ${{ vars.ECR_REPOSITORY }}
          DIGEST: ${{ steps.digest.outputs.digest }}
          EXPECTED_ARCH: ${{ vars.BACKEND_DEPLOY_TARGET == 'cohost-amd64' && 'amd64' || 'arm64' }}
        run: |
          IMAGE="$REGISTRY/$REPOSITORY@$DIGEST"
          docker pull --platform "linux/$EXPECTED_ARCH" "$IMAGE"
          PLATFORM="$(docker image inspect "$IMAGE" --format '{{.Os}}/{{.Architecture}}')"
          if [ "$PLATFORM" != "linux/$EXPECTED_ARCH" ]; then
            echo "Retained image platform does not match the deployment target; release/rollback refused without rebuilding." >&2
            exit 1
          fi
          echo "Verified retained image platform: $PLATFORM"

      # イメージだけでなく、それを動かす手順も検査済みのSHAのものへ揃える（DECISIONS 16）。
      # deploy.sh と docker-compose.prod.yml を毎回配ってから実行する。インスタンスを作るときに
      # 一度だけ動く user_data で配ると、git で直しても稼働中のホストは古いままになる。
      - name: Deploy via SSM Run Command
        if: vars.BACKEND_DEPLOY_TARGET != 'cohost-amd64'
        env:
          REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          REPOSITORY: ${{ vars.ECR_REPOSITORY }}
          TAG: ${{ steps.resolve.outputs.tag }}
          DIGEST: ${{ steps.digest.outputs.digest }}
          INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
        run: |
          IMAGE="$REGISTRY/$REPOSITORY@$DIGEST"

          # 守りたいのは「失敗を確定する時点で、SSM コマンドも成功しえない terminal 状態になって
          # いること」。SSM の期限は配信と実行で別に管理されるため、両方を明示したうえで、こちらの
          # 待機をその合計より長く取る。配信されないまま期限を過ぎれば DeliveryTimedOut、実行が
          # 期限を過ぎれば ExecutionTimedOut になるので、諦めた後に配信されて走り出す経路も、
          # 走り続ける経路も残らない。待機を延ばすだけでは、どちらの経路も塞げない。
          #
          # 実行の内訳は、ホストの health 待機（deploy.sh の --wait-timeout 240）に、ECR login・
          # Parameter Store からの取得・pull の余白を足したもの。
          SSM_DELIVERY_TIMEOUT=60
          SSM_EXECUTION_TIMEOUT=360
          POLL_SECONDS=450

          PARAMETERS=$(jq -n \
            --arg deploy "$(base64 -w0 infra/host/deploy.sh)" \
            --arg compose "$(base64 -w0 docker-compose.prod.yml)" \
            --arg logs "$(base64 -w0 docker-compose.logs.yml)" \
            --arg image "$IMAGE" \
            --arg timeout "$SSM_EXECUTION_TIMEOUT" \
            '{
              commands: [
                "set -eu",
                "install -d -m 755 /opt/abservice",
                "echo \($deploy) | base64 -d > /opt/abservice/deploy.sh",
                "chmod +x /opt/abservice/deploy.sh",
                "echo \($compose) | base64 -d > /opt/abservice/docker-compose.prod.yml",
                "echo \($logs) | base64 -d > /opt/abservice/docker-compose.logs.yml",
                "/opt/abservice/deploy.sh \($image)"
              ],
              executionTimeout: [$timeout]
            }')

          # comment は 100 文字まで。digest を含む参照は収まらないため、タグで書く
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy $TAG" \
            --timeout-seconds "$SSM_DELIVERY_TIMEOUT" \
            --parameters "$PARAMETERS" \
            --query "Command.CommandId" --output text)
          echo "SSM command id: $COMMAND_ID"

          # 既定の waiter は 5秒 × 20回（約100秒）で打ち切るため使わない。terminal status に
          # なるまで自分で追う。送信直後は invocation がまだ見えないことがあり、その間は Pending
          # として扱う。
          DEADLINE=$((SECONDS + POLL_SECONDS))
          STATUS=Pending

          while [ "$SECONDS" -lt "$DEADLINE" ]; do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" \
              --query "Status" --output text 2>/dev/null || echo Pending)

            case "$STATUS" in
            Pending | InProgress | Delayed) sleep 5 ;;
            *) break ;;
            esac
          done

          aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID"

          if [ "$STATUS" != "Success" ]; then
            echo "The deploy command ended as $STATUS." >&2
            exit 1
          fi

      - name: Deploy cohost via fixed SSM entrypoint
        if: vars.BACKEND_DEPLOY_TARGET == 'cohost-amd64'
        env:
          REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          REPOSITORY: ${{ vars.ECR_REPOSITORY }}
          DIGEST: ${{ steps.digest.outputs.digest }}
          SOURCE: ${{ steps.resolve.outputs.commit_sha }}
          NODE: ${{ vars.COHOST_MANAGED_NODE_ID }}
        run: |
          python3 .release-controller/infra/release/cohost.py \
            --checkout "$GITHUB_WORKSPACE" --source "$SOURCE" \
            --image "$REGISTRY/$REPOSITORY@$DIGEST" --node "$NODE"

  frontend:
    needs: deploy
    # backendの手動rollbackはfrontendを再ビルドしない。そちらは保存済み成果物から別途戻す。
    if: ${{ inputs.action == 'release' && needs.deploy.result == 'success' && needs.deploy.outputs.attempt == github.run_attempt }}
    uses: ./.github/workflows/deploy-frontend.yml
    with:
      commit_sha: ${{ needs.deploy.outputs.commit_sha }}
      normal_release: true
      source_repository: ${{ inputs.source_repository || github.repository }}
      controller_sha: ${{ inputs.controller_sha || github.sha }}
