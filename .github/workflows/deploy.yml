name: Deploy

# 本番へ出せるのはCIが成功したcommitだけとする。mainへのpushを直接のトリガーにすると、CIが失敗する
# commitでもデプロイが先に完了しうるため、CIの完了を受けて起動し、対象をそのCIが検査したSHAへ固定する。
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
  workflow_dispatch:
    inputs:
      commit_sha:
        description: "再デプロイする commit の full SHA（ロールバック用）。そのSHAのイメージ・deploy.sh・compose を使い、ビルドは行わない"
        required: true
        type: string

permissions:
  id-token: write
  contents: read

# preflightから両画面の配布完了まで、手動frontend操作も同じgroupで待たせる。
# queueはgroupで待ち始めた順（CIの完了順）であり、commit順ではない。
concurrency:
  group: deploy-production
  cancel-in-progress: false
  queue: max

jobs:
  preflight:
    name: Check frontend release before backend deployment
    if: >-
      github.ref == 'refs/heads/main' &&
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      vars.AWS_DEPLOY_ROLE_ARN != '' && vars.AWS_FRONTEND_DEPLOY_ROLE_ARN != ''
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      attempt: ${{ steps.release-state.outputs.attempt }}
      deploy: ${{ steps.release-state.outputs.deploy }}
    env:
      RELEASE_SHA: ${{ github.event.workflow_run.head_sha }}
      FRONTEND_PUBLIC_BUCKET: ${{ vars.FRONTEND_PUBLIC_BUCKET }}
      FRONTEND_ADMIN_BUCKET: ${{ vars.FRONTEND_ADMIN_BUCKET }}
      FRONTEND_RELEASE_BUCKET: ${{ vars.FRONTEND_RELEASE_BUCKET }}
      CLOUDFRONT_DISTRIBUTION_ID: ${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_FRONTEND_DEPLOY_ROLE_ARN }}
          aws-region: ap-northeast-1
      - name: Reject incomplete or unreadable frontend release state
        id: release-state
        run: |
          node infra/release/frontend.mjs preflight
          echo "attempt=$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"

  deploy:
    needs: preflight
    name: Build, push, and deploy backend
    # 本番の EC2 は arm64（infra/compute.tf が arm64 の AMI を選ぶ）。amd64 のランナーで作ると、
    # ECR へ入るのは実機が動かせないイメージになる。jar はランナー上の Gradle で組み、イメージは
    # それを包むだけなので、架構が効くのはイメージの manifest だけ。実機と同じ架構で組み、押し込む前に
    # 架構を確かめる（DECISIONS 16）
    runs-on: ubuntu-24.04-arm
    # terraform apply（#129のドメイン準備待ち）でリポジトリ変数が設定されるまでは何もしない。
    # CI経由の起動は、mainへのpushに対するCIが成功した場合だけに限る（PRのCIや失敗・中断は対象外）。
    if: >-
      !cancelled() && github.ref == 'refs/heads/main' &&
      vars.AWS_DEPLOY_ROLE_ARN != '' && (
        (github.event_name == 'workflow_dispatch' && needs.preflight.result == 'skipped') || (
          needs.preflight.result == 'success' &&
          needs.preflight.outputs.deploy == 'true' &&
          needs.preflight.outputs.attempt == github.run_attempt &&
          github.event.workflow_run.conclusion == 'success' &&
          github.event.workflow_run.head_branch == 'main' &&
          github.event.workflow_run.event == 'push' &&
          github.event.workflow_run.head_repository.full_name == github.repository))

    outputs:
      commit_sha: ${{ steps.resolve.outputs.commit_sha }}
      attempt: ${{ steps.resolve.outputs.attempt }}

    steps:
      # CIが検査したSHAをそのまま対象にする（デプロイ時点のmain先端ではない）。手動起動では指定された
      # commit を取る。動かすイメージも、それを配る手順（deploy.sh / compose）も、同じ commit から決まる。
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || inputs.commit_sha }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ap-northeast-1

      - name: Login to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Resolve image tag
        id: resolve
        env:
          EVENT_NAME: ${{ github.event_name }}
          COMMIT_SHA: ${{ inputs.commit_sha }}
          CI_RUN_ID: ${{ github.event.workflow_run.id }}
          CI_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          # commit_sha が空だと checkout が既定のブランチへ倒れ、配るファイルと対象イメージが
          # 別の commit のものになる。ビルドも配布もする前に止める
          if [ "$EVENT_NAME" = "workflow_dispatch" ] && [ -z "$COMMIT_SHA" ]; then
            echo "commit_sha is required: manual deploy only redeploys the image built from that commit." >&2
            echo "To ship a new commit, push it to main and let CI gate the deploy." >&2
            exit 1
          fi

          # タグは checkout した commit から決まる。手動起動でも、配るファイルと同じ commit の
          # イメージだけが対象になる（そのタグが ECR に在ることは digest を解くステップが確かめる）。
          # 接頭辞は infra/ecr.tf の保持規則と揃える（scripts/check-deploy-image-tag.sh が突き合わせる）
          echo "tag=sha-$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "commit_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "attempt=$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"

          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo "Redeploying the image built from $(git rev-parse HEAD) without rebuilding"
          else
            echo "Deploying commit $CI_HEAD_SHA verified by CI run $CI_RUN_ID"
          fi

      # 同じ commit のイメージを二度は作らない。ベースイメージやパッケージの取得を含むビルドは、同じ
      # commit でも同じ実体にならないため、作り直すとタグが別の digest へ移り、以前その commit で配った
      # 実体は untagged になって消える。ロールバックが戻すのは「その commit に最初に配った実体」であり、
      # それを保つには在るものを使うほかない（DECISIONS 16）。タグが在れば通常経路でもビルドと push を飛ばす。
      # 手動起動（ロールバック）でタグが無ければ、保持の期限を過ぎたか一度も配っていない commit なので止める
      - name: Check whether the image for this commit already exists
        id: existing
        env:
          EVENT_NAME: ${{ github.event_name }}
          REPOSITORY: ${{ vars.ECR_REPOSITORY }}
          TAG: ${{ steps.resolve.outputs.tag }}
        run: |
          if aws ecr describe-images --repository-name "$REPOSITORY" --image-ids imageTag="$TAG" >/dev/null 2>&1; then
            echo "Reusing the image already built for $TAG; it is not rebuilt or pushed again."
            echo "exists=true" >> "$GITHUB_OUTPUT"
          elif [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo "No image is tagged $TAG in $REPOSITORY." >&2
            echo "Rollback can only target a commit whose image is still retained (the 10 most recent deploys)." >&2
            exit 1
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      # 通常経路: CIが成功したcommitのイメージをビルドしてpushする（その commit のイメージが無いときだけ）。
      # jar はランナー上の Gradle で組み、Dockerfile はそれを包むだけ（CI の container-check と同じ手順。#431）
      - name: Set up JDK 25 (Corretto)
        if: steps.existing.outputs.exists == 'false'
        uses: actions/setup-java@v4
        with:
          distribution: corretto
          java-version: '25'

      - name: Set up Gradle
        if: steps.existing.outputs.exists == 'false'
        uses: gradle/actions/setup-gradle@v4

      - name: Build backend
        if: steps.existing.outputs.exists == 'false'
        run: |
          chmod +x backend/gradlew
          backend/gradlew -p backend --no-daemon --console=plain quarkusBuild

      - name: Build image
        if: steps.existing.outputs.exists == 'false'
        env:
          REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          REPOSITORY: ${{ vars.ECR_REPOSITORY }}
          TAG: ${{ steps.resolve.outputs.tag }}
        run: |
          docker build -f backend/src/main/docker/Dockerfile.jvm \
            -t "$REGISTRY/$REPOSITORY:$TAG" \
            backend

      # ECR へ入れる前に、実機が動かせる架構であることを確かめる。ランナーの種類が変わっても
      # ここで気付ける（動かない manifest を push してからでは、失敗するのはデプロイの最中になる）
      - name: Verify the image architecture matches the host
        if: steps.existing.outputs.exists == 'false'
        env:
          REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          REPOSITORY: ${{ vars.ECR_REPOSITORY }}
          TAG: ${{ steps.resolve.outputs.tag }}
        run: |
          ARCH="$(docker image inspect "$REGISTRY/$REPOSITORY:$TAG" --format '{{.Architecture}}')"
          if [ "$ARCH" != "arm64" ]; then
            echo "The image is $ARCH, but the instance runs arm64 (infra/compute.tf uses the arm64 AMI)." >&2
            exit 1
          fi
          echo "image architecture: $ARCH"

      - name: Push image
        if: steps.existing.outputs.exists == 'false'
        env:
          REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          REPOSITORY: ${{ vars.ECR_REPOSITORY }}
          TAG: ${{ steps.resolve.outputs.tag }}
        run: docker push "$REGISTRY/$REPOSITORY:$TAG"

      # 配るのはタグではなく digest。タグは IMMUTABLE で動かないが、配った実体をログと Summary に
      # 一意に残すのは digest であり、証跡（運用側の台帳）が記録する「稼働 image digest」の出所になる
      - name: Resolve the image digest
        id: digest
        env:
          REPOSITORY: ${{ vars.ECR_REPOSITORY }}
          TAG: ${{ steps.resolve.outputs.tag }}
        run: |
          DIGEST="$(aws ecr describe-images --repository-name "$REPOSITORY" --image-ids imageTag="$TAG" \
            --query 'imageDetails[0].imageDigest' --output text)"
          case "$DIGEST" in
          sha256:*) ;;
          *)
            echo "Could not resolve a digest for $REPOSITORY:$TAG (got '$DIGEST')." >&2
            exit 1
            ;;
          esac
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"
          echo "image tag: $TAG"
          echo "image digest: $DIGEST"
          {
            echo "## Backend image"
            echo "- tag: \`$TAG\`"
            echo "- digest: \`$DIGEST\`"
          } >> "$GITHUB_STEP_SUMMARY"

      # イメージだけでなく、それを動かす手順も検査済みのSHAのものへ揃える（DECISIONS 16）。
      # deploy.sh と docker-compose.prod.yml を毎回配ってから実行する。インスタンスを作るときに
      # 一度だけ動く user_data で配ると、git で直しても稼働中のホストは古いままになる。
      - name: Deploy via SSM Run Command
        env:
          REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          REPOSITORY: ${{ vars.ECR_REPOSITORY }}
          TAG: ${{ steps.resolve.outputs.tag }}
          DIGEST: ${{ steps.digest.outputs.digest }}
          INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
        run: |
          IMAGE="$REGISTRY/$REPOSITORY@$DIGEST"

          # 守りたいのは「失敗を確定する時点で、SSM コマンドも成功しえない terminal 状態になって
          # いること」。SSM の期限は配信と実行で別に管理されるため、両方を明示したうえで、こちらの
          # 待機をその合計より長く取る。配信されないまま期限を過ぎれば DeliveryTimedOut、実行が
          # 期限を過ぎれば ExecutionTimedOut になるので、諦めた後に配信されて走り出す経路も、
          # 走り続ける経路も残らない。待機を延ばすだけでは、どちらの経路も塞げない。
          #
          # 実行の内訳は、ホストの health 待機（deploy.sh の --wait-timeout 240）に、ECR login・
          # Parameter Store からの取得・pull の余白を足したもの。
          SSM_DELIVERY_TIMEOUT=60
          SSM_EXECUTION_TIMEOUT=360
          POLL_SECONDS=450

          PARAMETERS=$(jq -n \
            --arg deploy "$(base64 -w0 infra/host/deploy.sh)" \
            --arg compose "$(base64 -w0 docker-compose.prod.yml)" \
            --arg logs "$(base64 -w0 docker-compose.logs.yml)" \
            --arg image "$IMAGE" \
            --arg timeout "$SSM_EXECUTION_TIMEOUT" \
            '{
              commands: [
                "set -eu",
                "install -d -m 755 /opt/abservice",
                "echo \($deploy) | base64 -d > /opt/abservice/deploy.sh",
                "chmod +x /opt/abservice/deploy.sh",
                "echo \($compose) | base64 -d > /opt/abservice/docker-compose.prod.yml",
                "echo \($logs) | base64 -d > /opt/abservice/docker-compose.logs.yml",
                "/opt/abservice/deploy.sh \($image)"
              ],
              executionTimeout: [$timeout]
            }')

          # comment は 100 文字まで。digest を含む参照は収まらないため、タグで書く
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy $TAG" \
            --timeout-seconds "$SSM_DELIVERY_TIMEOUT" \
            --parameters "$PARAMETERS" \
            --query "Command.CommandId" --output text)
          echo "SSM command id: $COMMAND_ID"

          # 既定の waiter は 5秒 × 20回（約100秒）で打ち切るため使わない。terminal status に
          # なるまで自分で追う。送信直後は invocation がまだ見えないことがあり、その間は Pending
          # として扱う。
          DEADLINE=$((SECONDS + POLL_SECONDS))
          STATUS=Pending

          while [ "$SECONDS" -lt "$DEADLINE" ]; do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" \
              --query "Status" --output text 2>/dev/null || echo Pending)

            case "$STATUS" in
            Pending | InProgress | Delayed) sleep 5 ;;
            *) break ;;
            esac
          done

          aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID"

          if [ "$STATUS" != "Success" ]; then
            echo "The deploy command ended as $STATUS." >&2
            exit 1
          fi

  frontend:
    needs: deploy
    # backendの手動rollbackはfrontendを再ビルドしない。そちらは保存済み成果物から別途戻す。
    if: ${{ github.event_name == 'workflow_run' && needs.deploy.result == 'success' && needs.deploy.outputs.attempt == github.run_attempt }}
    uses: ./.github/workflows/deploy-frontend.yml
    with:
      commit_sha: ${{ needs.deploy.outputs.commit_sha }}
