name: Deploy

# 本番へ出せるのはCIが成功したcommitだけとする。mainへのpushを直接のトリガーにすると、CIが失敗する
# commitでもデプロイが先に完了しうるため、CIの完了を受けて起動し、対象をそのCIが検査したSHAへ固定する。
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
  workflow_dispatch:
    inputs:
      commit_sha:
        description: "再デプロイする commit の full SHA（ロールバック用）。そのSHAのイメージ・deploy.sh・compose を使い、ビルドは行わない"
        required: true
        type: string

permissions:
  id-token: write
  contents: read

# 同時デプロイによる競合を避ける。連続pushでも直前の実行を打ち切らず順番に反映する。
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Build, push, and deploy backend
    # 本番の EC2 は arm64（infra/compute.tf が arm64 の AMI を選ぶ）。amd64 のランナーで作ると、
    # ECR へ入るのは実機が動かせないイメージになる。エミュレーションでも作れるが、コンテナの中で
    # Gradle を回すビルドを QEMU に載せることになるため、ランナー自体を arm にする
    runs-on: ubuntu-24.04-arm
    # terraform apply（#129のドメイン準備待ち）でリポジトリ変数が設定されるまでは何もしない。
    # CI経由の起動は、mainへのpushに対するCIが成功した場合だけに限る（PRのCIや失敗・中断は対象外）。
    if: >-
      vars.AWS_DEPLOY_ROLE_ARN != '' && (
        github.event_name == 'workflow_dispatch' || (
          github.event.workflow_run.conclusion == 'success' &&
          github.event.workflow_run.head_branch == 'main' &&
          github.event.workflow_run.event == 'push'))

    steps:
      # CIが検査したSHAをそのまま対象にする（デプロイ時点のmain先端ではない）。手動起動では指定された
      # commit を取る。動かすイメージも、それを配る手順（deploy.sh / compose）も、同じ commit から決まる。
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || inputs.commit_sha }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ap-northeast-1

      - name: Login to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Resolve image tag
        id: resolve
        env:
          EVENT_NAME: ${{ github.event_name }}
          COMMIT_SHA: ${{ inputs.commit_sha }}
          CI_RUN_ID: ${{ github.event.workflow_run.id }}
          CI_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          # commit_sha が空だと checkout が既定のブランチへ倒れ、配るファイルと対象イメージが
          # 別の commit のものになる。ビルドも配布もする前に止める
          if [ "$EVENT_NAME" = "workflow_dispatch" ] && [ -z "$COMMIT_SHA" ]; then
            echo "commit_sha is required: manual deploy only redeploys the image built from that commit." >&2
            echo "To ship a new commit, push it to main and let CI gate the deploy." >&2
            exit 1
          fi

          # タグは checkout した commit から決まる。手動起動でも、配るファイルと同じ commit の
          # イメージだけが対象になる（そのタグが ECR に在ることは次のステップが確かめる）
          echo "tag=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo "Redeploying the image built from $(git rev-parse HEAD) without rebuilding"
            echo "build=false" >> "$GITHUB_OUTPUT"
          else
            echo "Deploying commit $CI_HEAD_SHA verified by CI run $CI_RUN_ID"
            echo "build=true" >> "$GITHUB_OUTPUT"
          fi

      # 通常経路: CIが成功したcommitのイメージをビルドしてpushする。
      - name: Build image
        if: steps.resolve.outputs.build == 'true'
        env:
          REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          REPOSITORY: ${{ vars.ECR_REPOSITORY }}
          TAG: ${{ steps.resolve.outputs.tag }}
        run: |
          docker build -f backend/src/main/docker/Dockerfile.jvm \
            -t "$REGISTRY/$REPOSITORY:$TAG" \
            -t "$REGISTRY/$REPOSITORY:latest" \
            backend

      # ECR へ入れる前に、実機が動かせる架構であることを確かめる。ランナーの種類が変わっても
      # ここで気付ける（動かない manifest を push してからでは、失敗するのはデプロイの最中になる）
      - name: Verify the image architecture matches the host
        if: steps.resolve.outputs.build == 'true'
        env:
          REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          REPOSITORY: ${{ vars.ECR_REPOSITORY }}
          TAG: ${{ steps.resolve.outputs.tag }}
        run: |
          ARCH="$(docker image inspect "$REGISTRY/$REPOSITORY:$TAG" --format '{{.Architecture}}')"
          if [ "$ARCH" != "arm64" ]; then
            echo "The image is $ARCH, but the instance runs arm64 (infra/compute.tf uses the arm64 AMI)." >&2
            exit 1
          fi
          echo "image architecture: $ARCH"

      - name: Push image
        if: steps.resolve.outputs.build == 'true'
        env:
          REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          REPOSITORY: ${{ vars.ECR_REPOSITORY }}
          TAG: ${{ steps.resolve.outputs.tag }}
        run: |
          docker push "$REGISTRY/$REPOSITORY:$TAG"
          docker push "$REGISTRY/$REPOSITORY:latest"

      # ロールバック経路: image_tag指定時は再ビルドせず、ECRに既に存在するタグのみを対象にする。
      - name: Verify target image exists
        if: steps.resolve.outputs.build == 'false'
        env:
          REPOSITORY: ${{ vars.ECR_REPOSITORY }}
          TAG: ${{ steps.resolve.outputs.tag }}
        run: aws ecr describe-images --repository-name "$REPOSITORY" --image-ids imageTag="$TAG"

      # イメージだけでなく、それを動かす手順も検査済みのSHAのものへ揃える（DECISIONS 16）。
      # deploy.sh と docker-compose.prod.yml を毎回配ってから実行する。インスタンスを作るときに
      # 一度だけ動く user_data で配ると、git で直しても稼働中のホストは古いままになる。
      - name: Deploy via SSM Run Command
        env:
          REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          REPOSITORY: ${{ vars.ECR_REPOSITORY }}
          TAG: ${{ steps.resolve.outputs.tag }}
          INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
        run: |
          IMAGE="$REGISTRY/$REPOSITORY:$TAG"

          PARAMETERS=$(jq -n \
            --arg deploy "$(base64 -w0 infra/host/deploy.sh)" \
            --arg compose "$(base64 -w0 docker-compose.prod.yml)" \
            --arg image "$IMAGE" \
            '{
              commands: [
                "set -eu",
                "install -d -m 755 /opt/abservice",
                "echo \($deploy) | base64 -d > /opt/abservice/deploy.sh",
                "chmod +x /opt/abservice/deploy.sh",
                "echo \($compose) | base64 -d > /opt/abservice/docker-compose.prod.yml",
                "/opt/abservice/deploy.sh \($image)"
              ]
            }')

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy $IMAGE" \
            --parameters "$PARAMETERS" \
            --query "Command.CommandId" --output text)
          echo "SSM command id: $COMMAND_ID"

          set +e
          aws ssm wait command-executed --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID"
          WAIT_EXIT=$?
          set -e

          aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID"
          exit $WAIT_EXIT
