name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# 同一ブランチの古い実行はキャンセルして最新のみ走らせる
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-check:
    name: Backend full check (spotless / checkstyle / unit+ArchUnit / integration)
    runs-on: ubuntu-latest

    # 統合テスト用 PostgreSQL（docker-compose と同じ postgres:15-alpine / abservice）
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: abservice
          POSTGRES_USER: abservice
          POSTGRES_PASSWORD: abservice
          POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --locale=C"
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U abservice -d abservice"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      # integrationTest の datasource（既定値と一致。明示して意図を残す）
      DB_HOST: localhost
      DB_PORT: "5432"
      DB_NAME: abservice
      DB_USERNAME: abservice
      DB_PASSWORD: abservice

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 25 (Corretto)
        uses: actions/setup-java@v4
        with:
          distribution: corretto
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Ensure gradlew is executable
        run: chmod +x backend/gradlew

      # アセットの統合テストは実ストレージを使う。PostgreSQL は service container で用意しているが、MinIO は
      # 起動コマンド指定が必要なため service container にできず、ローカルと同じ docker compose で起動する。
      - name: Start MinIO (object storage for asset integration tests)
        run: docker compose up -d --wait minio

      - name: Create asset bucket
        run: docker compose run --rm minio-init

      # check = spotlessCheck / checkstyleMain / checkstyleTest / test（ArchUnit含む） / integrationTest
      - name: Run full check
        run: backend/gradlew -p backend --no-daemon --console=plain check

      - name: Upload reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: backend-reports
          path: |
            backend/build/reports/tests/
            backend/build/reports/checkstyle/
          if-no-files-found: ignore
          retention-days: 7

  e2e:
    name: E2E (Playwright / 実スタック)
    runs-on: ubuntu-latest

    # backend-check と同じ構成の PostgreSQL。E2E も実DBに対して動かす（#164）
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: abservice
          POSTGRES_USER: abservice
          POSTGRES_PASSWORD: abservice
          POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --locale=C"
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U abservice -d abservice"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DB_HOST: localhost
      DB_PORT: "5432"
      DB_NAME: abservice
      DB_USERNAME: abservice
      DB_PASSWORD: abservice
      # E2E のシードは管理APIを通す。開発既定と同じ鍵を使う
      ADMIN_API_KEY: dev-admin-api-key

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 25 (Corretto)
        uses: actions/setup-java@v4
        with:
          distribution: corretto
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Ensure gradlew is executable
        run: chmod +x backend/gradlew

      - name: Start MinIO (object storage)
        run: docker compose up -d --wait minio

      - name: Create asset bucket
        run: docker compose run --rm minio-init

      - name: Install dependencies
        run: npm ci

      # ブラウザは実行ごとに落とすと重い。Playwright のバージョンで鍵を作る
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright browsers
        run: npm exec -w abservice-e2e -- playwright install --with-deps chromium

      - name: Build backend
        run: backend/gradlew -p backend --no-daemon --console=plain quarkusBuild

      # 公開サイトの組み立てが backend を叩くため、テストの前に起動しておく（起動待ちは E2E 側が行う）
      - name: Start backend
        run: |
          nohup java -jar backend/build/quarkus-app/quarkus-run.jar > backend.log 2>&1 &
          echo started

      - name: Run E2E
        run: npm run test:e2e

      - name: Show backend log
        if: ${{ failure() }}
        run: cat backend.log

      # trace と動画はレビューの証跡でもある（#164）。画像は evidence ブランチへ別途公開する
      - name: Upload Playwright artifacts
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: e2e-artifacts
          path: |
            e2e/test-results/
            e2e/playwright-report/
            e2e/evidence/
          if-no-files-found: ignore
          retention-days: 7
