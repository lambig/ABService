name: CI

on:
  push:
    branches: [main, "release/**"]
  pull_request:
    branches: [main, "release/**"]
  workflow_dispatch:

# GITHUB_TOKEN は読み取りに絞る。CI が触るのは checkout と依存の取得、アーティファクトの添付だけで、
# リポジトリへ書き戻す工程を持たない（証跡の evidence ブランチへの公開は手元の evidence:publish が行う）。
permissions:
  contents: read

# 同一ブランチの古い実行はキャンセルして最新のみ走らせる
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Select CI scope
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      application: ${{ steps.scope.outputs.application }}
      listening: ${{ steps.scope.outputs.listening }}
      infrastructure: ${{ steps.scope.outputs.infrastructure }}
      browser_plan: ${{ steps.scope.outputs.browser_plan }}
      browser_e2e: ${{ steps.scope.outputs.browser_e2e }}
      browser_player: ${{ steps.scope.outputs.browser_player }}
      browser_storage: ${{ steps.scope.outputs.browser_storage }}
      browser_shell: ${{ steps.scope.outputs.browser_shell }}
      browser_offline_player: ${{ steps.scope.outputs.browser_offline_player }}
      browser_audio_worklet: ${{ steps.scope.outputs.browser_audio_worklet }}
      browser_visualizer: ${{ steps.scope.outputs.browser_visualizer }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Include the PR merge base and both sides of renames/deletions.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Verify CI selection and aggregation
        run: node --test scripts/ci-policy.test.mjs scripts/browser-*.test.mjs
      - name: Verify local commit identity boundary
        run: bash scripts/git-identity.test.sh
      - name: Select affected tracks
        id: scope
        run: node scripts/ci.mjs select

  backend-check:
    needs: changes
    if: ${{ needs.changes.outputs.application == 'true' }}
    name: Backend full check (spotless / checkstyle / unit+ArchUnit / integration)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    # 統合テスト用 PostgreSQL（docker-compose と同じ postgres:15-alpine）。
    # データベース名はテスト専用のもの（#252）。ローカルは compose の init スクリプトが同じ名前で作る。
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: abservice_test
          POSTGRES_USER: abservice
          POSTGRES_PASSWORD: abservice
          POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --locale=C"
        ports:
          - 5432:5432
        # 起動直後は start-interval で細かく見る。interval だけだと最初の判定まで interval ぶん待ち、
        # それが Initialize containers の下限になる（#431）。docker-compose.yml の healthcheck と揃える。
        options: >-
          --health-cmd "pg_isready -U abservice -d abservice_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
          --health-start-period 30s
          --health-start-interval 2s

    env:
      # テストの datasource。DB 名は %test プロファイルの指定と同じ値を置く
      # （service container が作るデータベースと食い違わせない）
      DB_HOST: localhost
      DB_PORT: "5432"
      DB_NAME: abservice_test
      DB_USERNAME: abservice
      DB_PASSWORD: abservice

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 25 (Corretto)
        uses: actions/setup-java@v4
        with:
          distribution: corretto
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Ensure gradlew is executable
        run: chmod +x backend/gradlew

      - name: Install FLAC for real audio validation tests
        timeout-minutes: 5
        run: |
          apt_options=(-o Acquire::Retries=2 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 -o DPkg::Lock::Timeout=60)
          sudo apt-get "${apt_options[@]}" -o APT::Update::Error-Mode=any update
          sudo env DEBIAN_FRONTEND=noninteractive apt-get "${apt_options[@]}" install -y flac

      - name: 配布用FLAC実行環境の解析互換性を検査
        run: |
          docker build --target flac-runtime -f backend/src/main/docker/Dockerfile.jvm -t abservice-flac-check backend
          python3 scripts/check-flac-image.py abservice-flac-check

      # アセットの統合テストは実ストレージを使う。PostgreSQL は service container で用意しているが、MinIO は
      # 起動コマンド指定が必要なため service container にできず、ローカルと同じ docker compose で起動する。
      - name: Build MinIO server and client from pinned official sources
        run: docker compose build minio minio-init

      - name: Start MinIO (object storage for asset integration tests)
        run: docker compose up -d --wait minio

      - name: Create asset bucket
        run: docker compose run --rm minio-init

      # check = spotlessCheck / checkstyleMain / checkstyleTest / test（ArchUnit含む） / integrationTest
      # 外部のDB/MinIOはGradleのキャッシュキーに含まれない。統合テストは今回起動した実体へ必ず実行する。
      # --rerun は integrationTest だけに適用し、コンパイルや単体テストのキャッシュは維持する。
      - name: Run full check
        run: backend/gradlew -p backend --no-daemon --console=plain check integrationTest --rerun

      - name: Upload reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: backend-reports
          path: |
            backend/build/reports/tests/
            backend/build/reports/checkstyle/
          if-no-files-found: ignore
          retention-days: 7

  frontend-check:
    needs: changes
    if: ${{ needs.changes.outputs.application == 'true' }}
    name: Frontend check (prettier / eslint / astro check / unit)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Check application workspaces and their dependencies
        run: node scripts/ci.mjs frontend application

  listening-check:
    needs: changes
    if: ${{ needs.changes.outputs.listening == 'true' }}
    name: Listening frontend (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
        if: ${{ runner.os == 'Linux' }}
      - name: Install pinned audio Rust toolchain
        if: ${{ runner.os == 'Windows' }}
        run: rustup toolchain install 1.99.0 --profile minimal --target wasm32-unknown-unknown --component rustfmt
      - name: Verify reproducible RustFFT SIMD asset
        if: ${{ runner.os == 'Windows' }}
        env:
          CARGO_HOME: ${{ runner.temp }}/audio-cargo
        run: |
          cargo +1.99.0 fmt --manifest-path packages/audio-worklet/rust/Cargo.toml --check
          node packages/audio-worklet/rust/build.mjs --check
      - name: Check listening workspaces and their dependencies
        if: ${{ runner.os == 'Linux' }}
        run: node scripts/ci.mjs frontend listening

  api-types-check:
    needs: changes
    if: ${{ needs.changes.outputs.application == 'true' }}
    name: Generated API types in sync (OpenAPI -> schema.d.ts)
    runs-on: ubuntu-latest

    # backend と frontend の継ぎ目の検査。生成物（`schema.d.ts`）はコミットする運用のため、
    # 入力（backend のビルドが出す OpenAPI 定義）から作り直した結果と一致することを機械で確かめる。
    # DB も MinIO も要らない（定義の生成は型情報だけで完結し、実行時の依存を持たない）。
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 25 (Corretto)
        uses: actions/setup-java@v4
        with:
          distribution: corretto
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      # 生成器の検査が npm へワークスペースの集合を聞くため、依存の取得はその前に置く
      - name: Install dependencies
        run: npm ci

      # ルートの `generate:api-types` は `--workspaces --if-present` で回すため、生成器が消えても、
      # ルートの workspaces から外れても、その生成物は作り直されないまま下の差分検査を通る。
      # どちらもバックエンドのビルドより前に見る
      - name: Check every generated schema has a generator
        run: scripts/check-api-type-generators.mjs

      - name: Ensure gradlew is executable
        run: chmod +x backend/gradlew

      # 型生成の入力。build/openapi は quarkusBuild の宣言された出力に入っていないため、
      # タスクがキャッシュや前回の状態で実行されないと、定義は古いまま・無いまま成功する。
      # 検査したいのは今のソースから出る定義なので、キャッシュを使わず作り直す。
      - name: Build backend (OpenAPI definition)
        run: backend/gradlew -p backend --no-daemon --console=plain --no-build-cache clean quarkusBuild

      # 定義が書かれないまま先へ進むと、型生成は「入力が無い」で落ちる。原因が読めないので手前で止める
      - name: Verify the definition was produced
        run: |
          if [ ! -f backend/build/openapi/openapi.yaml ]; then
            echo "The build did not write backend/build/openapi/openapi.yaml." >&2
            echo "Check that quarkusBuild actually ran the augmentation step." >&2
            exit 1
          fi

      # 対象のワークスペースは `generate:api-types` が持つ。ここへ列挙すると、生成物を持つ
      # ワークスペースが増えたときに名前だけが古くなる（実体は落ちないため気付けない）
      - name: Regenerate API types
        run: npm run generate:api-types

      # 追跡していない生成物（新しいワークスペースのもの）も差分へ出すため intent-to-add してから比べる。
      # 落ちたときの直し方は差分そのものが示す（手元で同じ生成を回して commit する）
      - name: Fail if the committed types differ from the regenerated ones
        run: |
          git add --all --intent-to-add
          git diff --exit-code

  container-check:
    needs: changes
    if: ${{ needs.changes.outputs.application == 'true' }}
    name: Container and prod configuration (image build / boot)
    runs-on: ubuntu-24.04-arm
    env:
      COMPOSE_FILE: docker-compose.yml:docker-compose.prod.yml:docker-compose.ci.yml
      BACKEND_IMAGE: abservice-backend:ci
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: abservice
      DB_USERNAME: abservice
      DB_PASSWORD: abservice
      ADMIN_API_KEY: ci-admin-api-key
      ASSETS_BUCKET: abservice-assets
      ORIGIN_VERIFY_TOKEN: ci-origin-verify-token

    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/check-container
        with:
          architecture: arm64

  container-check-amd64:
    needs: changes
    if: ${{ needs.changes.outputs.application == 'true' }}
    name: Container and prod configuration (amd64 image build / boot)
    runs-on: ubuntu-24.04
    env:
      COMPOSE_FILE: docker-compose.yml:docker-compose.prod.yml:docker-compose.ci.yml
      BACKEND_IMAGE: abservice-backend:ci
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: abservice
      DB_USERNAME: abservice
      DB_PASSWORD: abservice
      ADMIN_API_KEY: ci-admin-api-key
      ASSETS_BUCKET: abservice-assets
      ORIGIN_VERIFY_TOKEN: ci-origin-verify-token

    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/check-container
        with:
          architecture: amd64

  iac-check:
    needs: changes
    if: ${{ needs.changes.outputs.infrastructure == 'true' }}
    name: IaC (terraform fmt / validate)
    runs-on: ubuntu-latest

    # 資格情報を要さない静的な検査だけを行う。state を触らないよう backend は初期化しない。
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # versions.tf の required_version の下限で検査する。手元が新しくても、宣言した下限で
      # 通らない書き方が入ったらここで落ちる
      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8
          terraform_wrapper: false

      # user_data はインスタンスの初回起動時にしか走らない。構文が壊れていればそのインスタンスは
      # bootstrap されないまま立ち上がるが、terraform validate はテンプレートの中身を見ない
      - name: Check the bootstrap script syntax
        run: bash -n infra/templates/user_data.sh.tpl

      # 権限の不足は実行して初めて分かり、しかもそれはデプロイの最中になる。叩く API と
      # ロールの定義がずれていないかを、実行の前に見る
      - name: Check the deploy roles allow what the deploy calls
        run: scripts/check-deploy-permissions.sh

      # 発行するタグの接頭辞と保持規則の接頭辞がずれると、イメージは規則の対象外のまま溜まる（#158）
      - name: Check the deploy issues the tags the ECR retention rule selects
        run: scripts/check-deploy-image-tag.sh

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Verify frontend delivery failure and recovery
        run: node --test infra/release/*.test.mjs infra/functions/*.test.mjs infra/headers/*.test.mjs infra/monitoring/*.test.mjs

      - name: Verify monitoring credential refresh without AWS
        run: |
          PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s infra/monitoring/credentials -p 'test_*.py' -v
          sudo python3 infra/monitoring/credentials/test_systemd.py

      - name: Verify monitoring log transport on an isolated Docker network
        run: |
          PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s infra/monitoring/transport -p 'test_diagnostics.py' -v
          sudo python3 infra/monitoring/transport/test_transport.py

      - name: Check formatting
        run: terraform fmt -check -recursive infra

      - name: Initialize without the backend
        run: terraform -chdir=infra init -backend=false

      - name: Validate
        run: terraform -chdir=infra validate

      - name: Verify DNS preparation and cutover without AWS
        run: terraform -chdir=infra test

      - name: Verify independent backup storage and freshness monitoring
        run: |
          PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s infra/cohost-backup -v
          terraform -chdir=infra/cohost-backup init -backend=false
          terraform -chdir=infra/cohost-backup validate
          terraform -chdir=infra/cohost-backup test

      - name: Verify independent cohost provisioning boundaries
        run: |
          terraform -chdir=infra/cohost-host init -backend=false
          terraform -chdir=infra/cohost-host validate
          terraform -chdir=infra/cohost-host test

      - name: Verify independent edge provisioning boundaries
        run: |
          terraform -chdir=infra/cohost-edge init -backend=false
          terraform -chdir=infra/cohost-edge validate
          terraform -chdir=infra/cohost-edge test

      - name: Verify the packaged compatibility handler without AWS
        run: |
          python3 -m zipfile -e infra/.terraform/static-page-404.zip "$RUNNER_TEMP/free-edge-package"
          node infra/functions/check-edge-package.mjs "$RUNNER_TEMP/free-edge-package"

  e2e:
    needs: changes
    if: ${{ needs.changes.outputs.application == 'true' }}
    name: E2E (Playwright / 実スタック)
    runs-on: ubuntu-latest

    # backend-check と同じ構成の PostgreSQL。E2E も実DBに対して動かす（#164）。
    # データベースは E2E 専用（#252）。母集団をシードしたものだけにするため、統合テストとも分ける。
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: abservice_e2e
          POSTGRES_USER: abservice
          POSTGRES_PASSWORD: abservice
          POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --locale=C"
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U abservice -d abservice_e2e"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
          --health-start-period 30s
          --health-start-interval 2s

    env:
      DB_HOST: localhost
      DB_PORT: "5432"
      DB_NAME: abservice_e2e
      DB_USERNAME: abservice
      DB_PASSWORD: abservice
      # E2E のシードは管理APIを通す。開発既定と同じ鍵を使う
      ADMIN_API_KEY: dev-admin-api-key

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 25 (Corretto)
        uses: actions/setup-java@v4
        with:
          distribution: corretto
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Ensure gradlew is executable
        run: chmod +x backend/gradlew

      - name: Build MinIO server and client from pinned official sources
        run: docker compose build minio minio-init

      - name: Start MinIO (object storage)
        run: docker compose up -d --wait minio

      - name: Create asset bucket
        run: docker compose run --rm minio-init

      - name: Install dependencies
        run: npm ci

      # ブラウザは実行ごとに落とすと重い。Playwright のバージョンで鍵を作る
      - name: Cache Playwright browsers
        if: needs.changes.outputs.browser_e2e == 'true'
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright browsers
        if: needs.changes.outputs.browser_e2e == 'true'
        run: npm exec -w abservice-e2e -- playwright install --with-deps chromium

      - name: Build backend
        run: backend/gradlew -p backend --no-daemon --console=plain quarkusBuild

      # 公開サイトの組み立てが backend を叩くため、テストの前に起動しておく（起動待ちは E2E 側が行う）。
      # 成果物は uber-jar（backend/gradle.properties）で、名前に版が入るため glob で拾う。
      #
      # プロファイルは dev を指定する。素で起動すると prod になり、本番向けに必須化した値
      # （アセットのバケット・S3 の資格情報など）を要求する。E2E で見たいのは画面であって本番構成では
      # ないため、ローカルと同じ既定値（docker compose の PostgreSQL と MinIO）で動かす。
      #
      # ポートと初期化はローカルの npm run dev:backend:e2e と揃える（#252）。E2E 用のデータベースを
      # 起動時に clean することで、母集団がシードしたものだけになる。
      - name: Start backend
        run: |
          jar="$(ls backend/build/*-runner.jar)"
          nohup java -Dquarkus.profile=dev \
            -Dquarkus.http.port=8090 \
            -Dquarkus.flyway.clean-at-start=true \
            -jar "$jar" > backend.log 2>&1 &
          echo "started: $jar"

      - name: Prepare application acceptance stack
        env:
          E2E_VERIFY_SEED_REUSE: 'true'
        run: node e2e/scripts/prepare-stack.mjs

      - name: Run E2E
        if: needs.changes.outputs.browser_e2e == 'true'
        env:
          BROWSER_PLAN: ${{ needs.changes.outputs.browser_plan }}
        run: node scripts/browser-ci.mjs e2e

      - name: Verify generation-checked SSG and withdrawn pages against the E2E database
        run: node infra/release/public-generation-acceptance.mjs

      # 初期データのローダ（#373）。dry-run・途中からの再開・冪等性を、同じ E2E 用バックエンドに対して通す
      - name: Verify the initial data loader against the E2E database
        run: npm run acceptance -w abservice-seed-loader

      - name: Show backend log
        if: ${{ failure() }}
        run: cat backend.log

      # trace と動画はレビューの証跡でもある（#164）。画像は evidence ブランチへ別途公開する
      - name: Upload Playwright artifacts
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: e2e-artifacts
          path: |
            e2e/test-results/
            e2e/playwright-report/
            e2e/evidence/
          if-no-files-found: ignore
          retention-days: 7

  player-browser:
    needs: changes
    if: ${{ needs.changes.outputs.browser_player == 'true' }}
    name: Player browser (Chromium / FLAC)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install Chromium
        run: |
          # Playwright supplies Chromium; the unrelated Chrome APT mirror is not needed.
          sudo rm -f /etc/apt/sources.list.d/google-chrome.list /etc/apt/sources.list.d/google-chrome.sources
          npm exec -w abservice-player -- playwright install --with-deps --only-shell chromium
      - name: Run production player browser tests
        env:
          BROWSER_PLAN: ${{ needs.changes.outputs.browser_plan }}
        run: node scripts/browser-ci.mjs player
      - name: Upload browser evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: player-browser
          path: packages/player/test-results/
          if-no-files-found: error
          retention-days: 7

  storage-browser:
    needs: changes
    if: ${{ needs.changes.outputs.browser_storage == 'true' }}
    name: Storage browser (Chromium / OPFS)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install Chromium
        run: |
          # Playwright supplies Chromium; the unrelated Chrome APT mirror is not needed.
          sudo rm -f /etc/apt/sources.list.d/google-chrome.list /etc/apt/sources.list.d/google-chrome.sources
          npm exec -w abservice-offline-storage -- playwright install --with-deps --only-shell chromium
      - name: Run production storage browser tests
        env:
          BROWSER_PLAN: ${{ needs.changes.outputs.browser_plan }}
        run: node scripts/browser-ci.mjs storage
      - name: Upload browser results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: storage-browser
          path: packages/offline-storage/test-results/
          if-no-files-found: error
          retention-days: 7

  shell-browser:
    needs: changes
    if: ${{ needs.changes.outputs.browser_shell == 'true' }}
    name: Shell browser (Chromium / Service Worker)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install Chromium
        run: |
          # Playwright supplies Chromium; the unrelated Chrome APT mirror is not needed.
          sudo rm -f /etc/apt/sources.list.d/google-chrome.list /etc/apt/sources.list.d/google-chrome.sources
