name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# GITHUB_TOKEN は読み取りに絞る。CI が触るのは checkout と依存の取得、アーティファクトの添付だけで、
# リポジトリへ書き戻す工程を持たない（証跡の evidence ブランチへの公開は手元の evidence:publish が行う）。
permissions:
  contents: read

# 同一ブランチの古い実行はキャンセルして最新のみ走らせる
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-check:
    name: Backend full check (spotless / checkstyle / unit+ArchUnit / integration)
    runs-on: ubuntu-latest

    # 統合テスト用 PostgreSQL（docker-compose と同じ postgres:15-alpine）。
    # データベース名はテスト専用のもの（#252）。ローカルは compose の init スクリプトが同じ名前で作る。
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: abservice_test
          POSTGRES_USER: abservice
          POSTGRES_PASSWORD: abservice
          POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --locale=C"
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U abservice -d abservice_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      # テストの datasource。DB 名は %test プロファイルの指定と同じ値を置く
      # （service container が作るデータベースと食い違わせない）
      DB_HOST: localhost
      DB_PORT: "5432"
      DB_NAME: abservice_test
      DB_USERNAME: abservice
      DB_PASSWORD: abservice

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 25 (Corretto)
        uses: actions/setup-java@v4
        with:
          distribution: corretto
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Ensure gradlew is executable
        run: chmod +x backend/gradlew

      # アセットの統合テストは実ストレージを使う。PostgreSQL は service container で用意しているが、MinIO は
      # 起動コマンド指定が必要なため service container にできず、ローカルと同じ docker compose で起動する。
      - name: Start MinIO (object storage for asset integration tests)
        run: docker compose up -d --wait minio

      - name: Create asset bucket
        run: docker compose run --rm minio-init

      # check = spotlessCheck / checkstyleMain / checkstyleTest / test（ArchUnit含む） / integrationTest
      - name: Run full check
        run: backend/gradlew -p backend --no-daemon --console=plain check

      - name: Upload reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: backend-reports
          path: |
            backend/build/reports/tests/
            backend/build/reports/checkstyle/
          if-no-files-found: ignore
          retention-days: 7

  frontend-check:
    name: Frontend check (prettier / eslint / astro check / unit)
    runs-on: ubuntu-latest

    # バックエンドを起動しない。lint と型検査はビルド時のデータ取得を伴わないため、
    # 画面の組み立て（E2E ジョブが行う）とは独立に走らせられる。
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      # 全ワークスペースを対象にする。一部だけを並べると、対象外のワークスペースで有効にした規約が
      # 一度も検査されない（#232）。対象の一覧は `lint` が持ち、ここには写さない。
      - name: Lint (all workspaces)
        run: npm run lint

      - name: Typecheck (markup)
        run: npm run typecheck:markup

      - name: Typecheck (audio-dsp)
        run: npm run typecheck:audio-dsp

      - name: Typecheck (installation)
        run: npm run typecheck:installation

      - name: Typecheck (patterns)
        run: npm run typecheck:patterns

      - name: Typecheck (public)
        run: npm run typecheck:public

      - name: Typecheck (admin)
        run: npm run typecheck:admin

      - name: Typecheck (e2e)
        run: npm run typecheck:e2e

      # 対象のワークスペースは `test:frontend` が持つ。ここへ列挙すると、ワークスペースが増えたときに
      # 名前だけが古くなる（実体は落ちないため気付けない）。規約ハーネス自身の検査もこの中に含まれ、
      # ルールの実装・設定が退行したらここで落ちる（#232）
      - name: Unit tests (frontend workspaces)
        run: npm run test:frontend

  api-types-check:
    name: Generated API types in sync (OpenAPI -> schema.d.ts)
    runs-on: ubuntu-latest

    # backend と frontend の継ぎ目の検査。生成物（`schema.d.ts`）はコミットする運用のため、
    # 入力（backend のビルドが出す OpenAPI 定義）から作り直した結果と一致することを機械で確かめる。
    # DB も MinIO も要らない（定義の生成は型情報だけで完結し、実行時の依存を持たない）。
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 25 (Corretto)
        uses: actions/setup-java@v4
        with:
          distribution: corretto
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      # 生成器の検査が npm へワークスペースの集合を聞くため、依存の取得はその前に置く
      - name: Install dependencies
        run: npm ci

      # ルートの `generate:api-types` は `--workspaces --if-present` で回すため、生成器が消えても、
      # ルートの workspaces から外れても、その生成物は作り直されないまま下の差分検査を通る。
      # どちらもバックエンドのビルドより前に見る
      - name: Check every generated schema has a generator
        run: scripts/check-api-type-generators.mjs

      - name: Ensure gradlew is executable
        run: chmod +x backend/gradlew

      # 型生成の入力。build/openapi は quarkusBuild の宣言された出力に入っていないため、
      # タスクがキャッシュや前回の状態で実行されないと、定義は古いまま・無いまま成功する。
      # 検査したいのは今のソースから出る定義なので、キャッシュを使わず作り直す。
      - name: Build backend (OpenAPI definition)
        run: backend/gradlew -p backend --no-daemon --console=plain --no-build-cache clean quarkusBuild

      # 定義が書かれないまま先へ進むと、型生成は「入力が無い」で落ちる。原因が読めないので手前で止める
      - name: Verify the definition was produced
        run: |
          if [ ! -f backend/build/openapi/openapi.yaml ]; then
            echo "The build did not write backend/build/openapi/openapi.yaml." >&2
            echo "Check that quarkusBuild actually ran the augmentation step." >&2
            exit 1
          fi

      # 対象のワークスペースは `generate:api-types` が持つ。ここへ列挙すると、生成物を持つ
      # ワークスペースが増えたときに名前だけが古くなる（実体は落ちないため気付けない）
      - name: Regenerate API types
        run: npm run generate:api-types

      # 追跡していない生成物（新しいワークスペースのもの）も差分へ出すため intent-to-add してから比べる。
      # 落ちたときの直し方は差分そのものが示す（手元で同じ生成を回して commit する）
      - name: Fail if the committed types differ from the regenerated ones
        run: |
          git add --all --intent-to-add
          git diff --exit-code

  container-check:
    name: Container and prod configuration (image build / boot)
    runs-on: ubuntu-latest

    # E2E が起動するのは dev プロファイルの JAR であり、本番が動かす形とは別物。ここで見るのは
    # 本番と同じ経路（Dockerfile.jvm のイメージを docker-compose.prod.yml で起動する）。
    # 起動に必要な値は compose のファイルが渡すものだけなので、受け渡しの漏れは起動の失敗として出る。
    env:
      COMPOSE_FILE: docker-compose.yml:docker-compose.prod.yml:docker-compose.ci.yml
      BACKEND_IMAGE: abservice-backend:ci
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: abservice
      DB_USERNAME: abservice
      DB_PASSWORD: abservice
      ADMIN_API_KEY: ci-admin-api-key
      ASSETS_BUCKET: abservice-assets

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 必須の一覧は宣言から自動で拾うため、宣言そのものを弱める変更は「必須が1つ減った」としか
      # 見えず、後続の検査も素通りする。弱い値で本番が動くことを意味する設定はここで名指しして守る
      - name: Check the required prod settings stay required
        run: scripts/check-prod-settings-stay-required.sh

      # 宣言があるだけでは値は本番へ届かない。Parameter Store から取って compose へ渡すまでの経路が
      # 繋がっていることを、イメージを作る前に見る。運ぶ経路が無い形は、起動してみるまで表に出ない
      - name: Check the prod configuration reaches the container
        run: scripts/check-prod-config-wiring.sh

      # デプロイのたびに SSM が実機へ配るファイル。リポジトリでもコンテナでも動かないため、
      # 壊れていても他の検査には現れず、差し替えの最中の実機で初めて分かる
      - name: Check the files the deploy sends to the host
        run: scripts/check-deploy-payload.sh

      # デプロイと同じ Dockerfile。壊れていることに気付けるのが deploy.yml の実行時では遅い
      - name: Build the production image
        run: docker build -f backend/src/main/docker/Dockerfile.jvm -t abservice-backend:ci backend

      # prod の compose は DB の起動を待たない（本番の接続先は RDS で、同じ compose には居ない）。
      # backend は起動時にマイグレーションを行うため、先に DB を用意しておく
      - name: Start PostgreSQL
        run: docker compose up -d --wait --wait-timeout 120 postgres

      # prod は設定が無いときに弱い既定値へ倒れず起動を失敗させる（DECISIONS 34）。倒れる側へ戻ると、
      # 本番が既定のバケットや開発用の API キーで動きうる。欠かす設定は1つずつで、
      # まとめて欠かすと1つが既定値を持つ側へ戻っても残りの欠落で失敗し続け、戻ったことに気付けない
      - name: Fail to start when any single required setting is missing
        run: scripts/check-prod-required-settings.sh

      - name: Start the production stack
        run: docker compose up -d --wait --wait-timeout 240 backend

      # readiness は DB 接続確認を含む。マイグレーションまで通っていることがここで分かる
      - name: Check readiness through the published port
        run: curl -fsS http://localhost:8080/q/health/ready

      - name: Show backend log
        if: ${{ failure() }}
        run: docker compose logs backend

      - name: Stop the stack
        if: ${{ always() }}
        run: docker compose down -v

  iac-check:
    name: IaC (terraform fmt / validate)
    runs-on: ubuntu-latest

    # 資格情報を要さない静的な検査だけを行う。state を触らないよう backend は初期化しない。
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # versions.tf の required_version の下限で検査する。手元が新しくても、宣言した下限で
      # 通らない書き方が入ったらここで落ちる
      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8
          terraform_wrapper: false

      - name: Check formatting
        run: terraform fmt -check -recursive infra

      - name: Initialize without the backend
        run: terraform -chdir=infra init -backend=false

      - name: Validate
        run: terraform -chdir=infra validate

  e2e:
    name: E2E (Playwright / 実スタック)
    runs-on: ubuntu-latest

    # backend-check と同じ構成の PostgreSQL。E2E も実DBに対して動かす（#164）。
    # データベースは E2E 専用（#252）。母集団をシードしたものだけにするため、統合テストとも分ける。
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: abservice_e2e
          POSTGRES_USER: abservice
          POSTGRES_PASSWORD: abservice
          POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --locale=C"
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U abservice -d abservice_e2e"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DB_HOST: localhost
      DB_PORT: "5432"
      DB_NAME: abservice_e2e
      DB_USERNAME: abservice
      DB_PASSWORD: abservice
      # E2E のシードは管理APIを通す。開発既定と同じ鍵を使う
      ADMIN_API_KEY: dev-admin-api-key

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 25 (Corretto)
        uses: actions/setup-java@v4
        with:
          distribution: corretto
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Ensure gradlew is executable
        run: chmod +x backend/gradlew

      - name: Start MinIO (object storage)
        run: docker compose up -d --wait minio

      - name: Create asset bucket
        run: docker compose run --rm minio-init

      - name: Install dependencies
        run: npm ci

      # ブラウザは実行ごとに落とすと重い。Playwright のバージョンで鍵を作る
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright browsers
        run: npm exec -w abservice-e2e -- playwright install --with-deps chromium

      - name: Build backend
        run: backend/gradlew -p backend --no-daemon --console=plain quarkusBuild

      # 公開サイトの組み立てが backend を叩くため、テストの前に起動しておく（起動待ちは E2E 側が行う）。
      # 成果物は uber-jar（backend/gradle.properties）で、名前に版が入るため glob で拾う。
      #
      # プロファイルは dev を指定する。素で起動すると prod になり、本番向けに必須化した値
      # （アセットのバケット・S3 の資格情報など）を要求する。E2E で見たいのは画面であって本番構成では
      # ないため、ローカルと同じ既定値（docker compose の PostgreSQL と MinIO）で動かす。
      #
      # ポートと初期化はローカルの npm run dev:backend:e2e と揃える（#252）。E2E 用のデータベースを
      # 起動時に clean することで、母集団がシードしたものだけになる。
      - name: Start backend
        run: |
          jar="$(ls backend/build/*-runner.jar)"
          nohup java -Dquarkus.profile=dev \
            -Dquarkus.http.port=8090 \
            -Dquarkus.flyway.clean-at-start=true \
            -jar "$jar" > backend.log 2>&1 &
          echo "started: $jar"

      - name: Run E2E
        run: npm run test:e2e

      - name: Show backend log
        if: ${{ failure() }}
        run: cat backend.log

      # trace と動画はレビューの証跡でもある（#164）。画像は evidence ブランチへ別途公開する
      - name: Upload Playwright artifacts
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: e2e-artifacts
          path: |
            e2e/test-results/
            e2e/playwright-report/
            e2e/evidence/
          if-no-files-found: ignore
          retention-days: 7
