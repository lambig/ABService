services:
  backend:
    image: ${BACKEND_IMAGE}
    container_name: abservice-backend
    restart: unless-stopped
    environment:
      DB_URL: ${DB_URL}
      DB_REACTIVE_URL: ${DB_REACTIVE_URL}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      ADMIN_API_KEY: ${ADMIN_API_KEY}
    ports:
      - "8080:8080"
    # readiness はDB接続を含む。start_period はマイグレーション込みの起動時間を見込む。
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/q/health/ready"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
