services:
  backend:
    image: ${BACKEND_IMAGE}
    container_name: abservice-backend
    restart: unless-stopped
    environment:
      DB_URL: ${DB_URL}
      DB_REACTIVE_URL: ${DB_REACTIVE_URL}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      ADMIN_API_KEY: ${ADMIN_API_KEY}
    ports:
      - "8080:8080"
