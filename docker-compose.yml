version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15.20-alpine3.24@sha256:23799e521dee9265a8b388ecf3bc0f1eaa34b95be67f5a76af4f8f6adb44c720
    container_name: abservice-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: abservice
      POSTGRES_USER: abservice
      POSTGRES_PASSWORD: abservice
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --locale=C"
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d
    networks:
      - abservice-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U abservice -d abservice"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
      start_interval: 2s

  mailhog:
    image: mailhog/mailhog:latest
    container_name: abservice-mailhog
    restart: unless-stopped
    ports:
      - "127.0.0.1:1025:1025"  # SMTP
      - "127.0.0.1:8025:8025"  # Web UI
    networks:
      - abservice-network

  # MinIO (S3 Compatible Object Storage)
  # 公式ソースの固定コミットからビルドする。取得・更新手順は docker/README.md。
  minio:
    build:
      context: ./docker/minio
      target: minio
    container_name: abservice-minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin123
    ports:
      - "127.0.0.1:9000:9000"  # API
      - "127.0.0.1:9001:9001"  # Console
    volumes:
      - minio_data:/data
    networks:
      - abservice-network
    command: server /data --console-address ":9001"
    # 起動直後は start_interval で細かく見る。interval だけだと最初の判定まで interval ぶん待つため、
    # `up --wait` や depends_on の service_healthy がそのまま起動待ちの下限になる（#431）。
    # start_interval は Docker Engine 25 以降。
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
      start_period: 30s
      start_interval: 2s

  # MinIO bucket bootstrap (アセット保管バケットを作成して終了する一過性コンテナ)
  #
  # 配信対象の接頭辞 (assets/) だけを鍵なしで読めるようにする。本番は CloudFront が OAC で S3 を読み、
  # 配信するのは同じ接頭辞だけで、受け入れ前 (pending/) は配信パスの外にある (infra/README.md)。
  # ローカルには CloudFront が無いため、同じ「配信対象だけが届く」形をバケットの側で作る。
  minio-init:
    build:
      context: ./docker/minio
      target: mc
    container_name: abservice-minio-init
    depends_on:
      minio:
        condition: service_healthy
    networks:
      - abservice-network
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin123 &&
      mc mb --ignore-existing local/abservice-assets &&
      mc anonymous set download local/abservice-assets/assets
      "

volumes:
  postgres_data:
    driver: local
  minio_data:
    driver: local

networks:
  abservice-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16
